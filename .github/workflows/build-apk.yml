name: Build Android APK
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build Web App
        run: |
          npm install
          npm run build

      - name: Set up Java for Android Build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor & Android platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init MotoDrive com.motodrive.app --web-dir dist
          npx cap add android

      - name: Fix Kotlin Version Conflict
        run: |
          echo "
          configurations.all {
              resolutionStrategy.eachDependency { details ->
                  if (details.requested.group == 'org.jetbrains.kotlin') {
                      details.useVersion '1.8.22'
                  }
              }
          }
          " >> android/app/build.gradle

      - name: Build APK using Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Extract Android Signing Report (SHA-1 & SHA-256)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew signingReport

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
