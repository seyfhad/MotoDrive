name: Build Android APK
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & Build Web App
        run: |
          npm install
          npm run build

      - name: Set up Java for Android Build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sync Capacitor Android platform
        run: |
          # Copy google-services.json to android/app if available
          if [ -f google-services.json ]; then 
            cp google-services.json android/app/google-services.json
          fi

          # Ensure keystore & signing properties are in place
          if [ -f release.keystore ]; then
            cp release.keystore android/app/release.keystore
          elif [ -f android/app/release.keystore ]; then
            cp android/app/release.keystore release.keystore
          fi

          if [ -f release-signing.properties ]; then
            cp release-signing.properties android/release-signing.properties
          fi

          # Sync web assets and plugins to android without deleting custom config
          npx cap sync android

      - name: Generate Native App Icons
        run: |
          npm install -g @capacitor/assets
          mkdir -p assets
          cp icon.jpg assets/icon.png
          npx @capacitor/assets generate --android || true

      - name: Build Debug and Release APKs using Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew assembleRelease --stacktrace

      - name: Sign Release APK (Guaranteed Signed APK)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. Check if custom secret keystore is provided
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using GitHub secret keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            KS_PASS="$KEYSTORE_PASSWORD"
            KS_ALIAS="$KEY_ALIAS"
            K_PASS="$KEY_PASSWORD"
          # 2. Check if local repo release.keystore exists
          elif [ -f android/app/release.keystore ]; then
            echo "Using repository release.keystore..."
            KS_PASS="MotoDrive2026SecureKey!"
            KS_ALIAS="motodrive-key"
            K_PASS="MotoDrive2026SecureKey!"
          # 3. Otherwise generate a fresh release keystore on the fly
          else
            echo "Generating build release keystore on the fly..."
            keytool -genkey -v -keystore android/app/release.keystore \
              -alias motodrive-key -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "MotoDrive2026SecureKey!" -keypass "MotoDrive2026SecureKey!" \
              -dname "CN=MotoDrive, OU=Mobile, O=MotoDrive, L=Algiers, S=Algiers, C=DZ"
            KS_PASS="MotoDrive2026SecureKey!"
            KS_ALIAS="motodrive-key"
            K_PASS="MotoDrive2026SecureKey!"
          fi

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"

          # Sign the release APK if app-release-unsigned.apk exists
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            $APKSIGNER sign --ks android/app/release.keystore \
              --ks-pass pass:"$KS_PASS" \
              --ks-key-alias "$KS_ALIAS" \
              --key-pass pass:"$K_PASS" \
              --out android/app/build/outputs/apk/release/app-release-signed.apk \
              android/app/build/outputs/apk/release/app-release-unsigned.apk
            
            # Remove unsigned APK so only signed APK remains
            rm -f android/app/build/outputs/apk/release/app-release-unsigned.apk
            cp android/app/build/outputs/apk/release/app-release-signed.apk android/app/build/outputs/apk/release/app-release.apk
          fi

      - name: Extract Android Signing Report (SHA-1 & SHA-256)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew signingReport

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
