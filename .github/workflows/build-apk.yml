name: Build Android APK

on:
  push:
    branches:
      - fix/facebook-native-oauth
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: fix/facebook-native-oauth

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & Build Web App
        run: |
          npm install
          npm run build

      - name: Set up Java for Android Build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor & Android platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap sync android
          if [ -f google-services.json ]; then cp google-services.json android/app/; fi

      - name: Build APK using Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: motodrive-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
