name: Build Android APK

on:
  push:
    branches:
      - main
      - fix/facebook-native-oauth
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor-community/facebook-login@^6.0.0 --save

      - name: Type-check
        run: npm run lint

      - name: Build Web App
        run: npm run build

      - name: Set up Java for Android Build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK using Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: motodrive-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
