<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoDrive</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 40px;
            background: #f4f6f8;
            color: #333;
            text-align: center;
        }

        .container {
            position: relative;
            max-width: 700px;
            margin: auto;
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .welcome-card-close {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 32px;
            height: 32px;
            border: 0;
            border-radius: 50%;
            background: #eef1f4;
            color: #333;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
        }

        .welcome-card-close:hover,
        .welcome-card-close:focus-visible {
            background: #dce2e8;
        }

        h1 {
            color: #0056b3;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        .links {
            margin-top: 30px;
        }

        .links button {
            display: inline-block;
            margin: 0 10px;
            padding: 0;
            border: 0;
            background: transparent;
            color: #0056b3;
            font: inherit;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .links button:hover,
        .links button:focus-visible {
            text-decoration: underline;
        }
    </style>
  <script type="module" crossorigin src="./assets/index-W48qN49T.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DuHB2sFc.css">
</head>
<body>
    <div id="welcome-card" class="container" role="dialog" aria-labelledby="welcome-card-title">
        <button
            type="button"
            class="welcome-card-close"
            aria-label="إغلاق"
            title="إغلاق"
            onclick="document.getElementById('welcome-card').remove()"
        >
            <span aria-hidden="true">×</span>
        </button>

        <h1 id="welcome-card-title">MotoDrive</h1>
        <p>
            تطبيق MotoDrive هو منصة مخصصة لتسهيل التنقل وخدمات التوصيل بالدراجات النارية في الجزائر، عبر ربط المستخدمين بالسائقين.
        </p>
        <p>
            يستخدم التطبيق مصادقة حسابات جوجل لتأمين تسجيل الدخول وحماية بيانات المستخدمين الشخصية.
        </p>

        <div class="links" aria-label="الوثائق القانونية">
            <button
                type="button"
                onclick="window.dispatchEvent(new CustomEvent('open-legal', { detail: { tab: 'privacy' } }))"
            >
                سياسة الخصوصية
            </button>
            <span aria-hidden="true">|</span>
            <button
                type="button"
                onclick="window.dispatchEvent(new CustomEvent('open-legal', { detail: { tab: 'terms' } }))"
            >
                شروط الاستخدام
            </button>
        </div>
    </div>

    <div id="root"></div>
</body>
</html>
