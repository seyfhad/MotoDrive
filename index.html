<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MotoDrive</title>
    <meta name="description" content="تطبيق ومنصة MotoDrive لحجز ونقل الأشخاص بالدراجات النارية في الجزائر - تطبيق الراكب، السائق، والتفاوض المباشر على الأجرة" />
    <meta property="og:title" content="MotoDrive" />
    <meta property="og:description" content="تطبيق ومنصة MotoDrive لحجز ونقل الأشخاص بالدراجات النارية في الجزائر - تطبيق الراكب، السائق، والتفاوض المباشر على الأجرة" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/jpeg" href="./icon.jpg" />
    <link rel="apple-touch-icon" href="./icon.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker registered!'))
            .catch(err => console.log('Service Worker error: ', err));
        });
      }
    </script>
  </body>
</html>
